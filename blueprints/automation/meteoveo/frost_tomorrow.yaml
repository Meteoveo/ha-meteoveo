blueprint:
  name: MeteoVeo — frost tomorrow
  description: >-
    Every evening at the time you choose, checks tomorrow's minimum temperature
    in the MeteoVeo forecast and runs your actions if it is at or below your
    threshold — cover the plants, protect the pipes, send a reminder. The
    forecast minimum is available to your actions as {{ low }}.


    Helada mañana: cada tarde comprueba la mínima prevista para mañana y ejecuta
    tus acciones si baja del umbral.
  domain: automation
  source_url: https://github.com/Meteoveo/ha-meteoveo/blob/main/blueprints/automation/meteoveo/frost_tomorrow.yaml
  input:
    weather_entity:
      name: MeteoVeo weather
      description: The MeteoVeo weather entity of your place.
      selector:
        entity:
          filter:
            - integration: meteoveo
              domain: weather
    threshold:
      name: At or below
      default: 2
      selector:
        number:
          min: -10
          max: 10
          step: 0.5
          unit_of_measurement: °C
    check_time:
      name: Check at
      default: "20:00:00"
      selector:
        time: {}
    actions:
      name: Actions
      description: What to do — for example a notification using {{ low }}.
      default: []
      selector:
        action: {}

mode: single

variables:
  weather_entity: !input weather_entity
  threshold: !input threshold

triggers:
  - trigger: time
    at: !input check_time

actions:
  - action: weather.get_forecasts
    target:
      entity_id: !input weather_entity
    data:
      type: daily
    response_variable: forecasts
  - variables:
      tomorrow: "{{ (now() + timedelta(days=1)).date() | string }}"
      low: >-
        {% set days = forecasts[weather_entity].forecast
           | selectattr('datetime', 'search', '^' ~ tomorrow) | list %}
        {{ days[0].templow if days and days[0].templow is number else none }}
  - condition: template
    value_template: "{{ low is number and low <= threshold }}"
  - sequence: !input actions
