rules:
  # --- Bronze -------------------------------------------------------------
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling: done
  brands:
    status: done
    comment: Brand assets ship in custom_components/meteoveo/brand. A
      submission to home-assistant/brands follows once the integration is
      published.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: No third-party runtime dependencies; requirements is empty.
  docs-actions:
    status: exempt
    comment: No service actions to document.
  docs-conditions:
    status: exempt
    comment: No conditions provided.
  docs-triggers:
    status: exempt
    comment: No triggers provided.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities take their state from the coordinator and subscribe to
      no external events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # --- Silver -------------------------------------------------------------
  action-exceptions:
    status: exempt
    comment: No service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # --- Gold: not claimed --------------------------------------------------
  # Discovery, repair issues and translated exceptions are the remaining
  # work; the integration does not claim gold.
  diagnostics:
    status: done
    comment: Keys, station id, email and coordinates are redacted.
