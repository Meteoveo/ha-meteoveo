<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeteoVeo card — preview</title>
<style>
  /* Home Assistant theme variables, light and dark (default HA theme values). */
  :root {
    --primary-text-color: #212121; --secondary-text-color: #727272;
    --card-background-color: #ffffff; --primary-background-color: #fafafa;
    --divider-color: rgba(0, 0, 0, .12); --ha-card-border-radius: 12px;
    --ha-card-border-color: var(--divider-color);
    --mdc-icon-size: 24px;
  }
  :root[data-theme="dark"] {
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --card-background-color: #1c1c1c; --primary-background-color: #111111;
    --divider-color: rgba(225, 225, 225, .12);
  }
  body { margin: 0; padding: 20px; background: var(--primary-background-color); color: var(--primary-text-color);
    font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif; }
  h1 { font-size: 14px; font-weight: 500; margin: 0 0 14px; color: var(--secondary-text-color); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; align-items: start; }
  .case { display: flex; flex-direction: column; gap: 6px; }
  .case > span { font-size: 12px; color: var(--secondary-text-color); }
</style>
</head>
<body>
<h1 id="title">MeteoVeo card — preview</h1>
<div class="grid" id="grid"></div>

<script type="module">
// --- Minimal stand-ins for HA's own elements --------------------------------------
class HaCard extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: "open" }).innerHTML = `<style>
    :host { display:block; background: var(--card-background-color); border-radius: var(--ha-card-border-radius, 12px);
      border: 1px solid var(--ha-card-border-color); box-shadow: 0 1px 2px rgba(0,0,0,.08); color: var(--primary-text-color); }
  </style><slot></slot>`; }
}
customElements.define("ha-card", HaCard);

// Hand-drawn glyphs; the real ha-icon renders Material Design Icons inside HA.
const G = {
  "mdi:weather-sunny": `<circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>`,
  "mdi:weather-night": `<path fill="currentColor" d="M14 3a8.5 8.5 0 1 0 7 13.2A9 9 0 0 1 14 3z"/>`,
  "mdi:weather-cloudy": `<path fill="currentColor" d="M6.5 19h11a4 4 0 0 0 .4-8A6 6 0 0 0 6.3 12.1 3.5 3.5 0 0 0 6.5 19z"/>`,
  "mdi:weather-partly-cloudy": `<circle cx="8" cy="8" r="3" fill="currentColor"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2v1.6M8 12.4V14M2 8h1.6M12.4 8H14M3.8 3.8l1.1 1.1M3.8 12.2l1.1-1.1M12.2 3.8l-1.1 1.1"/></g><path fill="currentColor" stroke="var(--card-background-color)" stroke-width="1.2" d="M9.5 21h9a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6 1 3 3 0 0 0 .3 6z"/>`,
  "mdi:weather-night-partly-cloudy": `<path fill="currentColor" d="M9 2a5.5 5.5 0 1 0 4.5 8.6A6 6 0 0 1 9 2z"/><path fill="currentColor" stroke="var(--card-background-color)" stroke-width="1.2" d="M9.5 21h9a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6 1 3 3 0 0 0 .3 6z"/>`,
  "mdi:weather-rainy": `<path fill="currentColor" d="M6.5 16h11a4 4 0 0 0 .4-8A6 6 0 0 0 6.3 9.1 3.5 3.5 0 0 0 6.5 16z"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18.5l-1 2.5M13 18.5l-1 2.5M17 18.5l-1 2.5"/></g>`,
  "mdi:weather-pouring": `<path fill="currentColor" d="M6.5 15h11a4 4 0 0 0 .4-8A6 6 0 0 0 6.3 8.1 3.5 3.5 0 0 0 6.5 15z"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 17l-1.5 4M11.5 17L10 21M15 17l-1.5 4M18.5 17L17 21"/></g>`,
  "mdi:weather-lightning-rainy": `<path fill="currentColor" d="M6.5 15h11a4 4 0 0 0 .4-8A6 6 0 0 0 6.3 8.1 3.5 3.5 0 0 0 6.5 15z"/><path fill="currentColor" d="M12.5 15.5l-2.5 4h2l-1 3.5 3.5-4.5h-2l1.2-3z"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7.5 17l-1 2.5M17.5 17l-1 2.5"/></g>`,
  "mdi:weather-snowy": `<path fill="currentColor" d="M6.5 15h11a4 4 0 0 0 .4-8A6 6 0 0 0 6.3 8.1 3.5 3.5 0 0 0 6.5 15z"/><g fill="currentColor"><circle cx="8.5" cy="18.5" r="1.2"/><circle cx="12" cy="20.5" r="1.2"/><circle cx="15.5" cy="18.5" r="1.2"/></g>`,
  "mdi:weather-fog": `<g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10h16M6 14h12M4 18h16"/></g>`,
  "mdi:weather-windy": `<g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 9h10a2.2 2.2 0 1 0-2.2-2.2M3 13h14a2.2 2.2 0 1 1-2.2 2.2M3 17h7"/></g>`,
  "mdi:water-percent": `<path fill="currentColor" d="M12 2.5S5.5 9.3 5.5 14a6.5 6.5 0 0 0 13 0c0-4.7-6.5-11.5-6.5-11.5z"/><g stroke="var(--card-background-color)" stroke-width="1.3"><circle cx="9.8" cy="12" r="1.3"/><circle cx="14.2" cy="16" r="1.3"/><path d="M14.5 11l-5 6"/></g>`,
  "mdi:alert": `<path fill="currentColor" d="M12 3L1.5 21h21L12 3z"/><path stroke="var(--card-background-color)" stroke-width="2" stroke-linecap="round" d="M12 10v4.5M12 17.6v.2"/>`,
};
class HaIcon extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  constructor() { super(); this.attachShadow({ mode: "open" }); }
  connectedCallback() { this._draw(); }
  attributeChangedCallback() { this._draw(); }
  _draw() {
    const icon = this.getAttribute("icon") || "";
    const g = G[icon] || G["mdi:weather-cloudy"];
    this.shadowRoot.innerHTML = `<style>:host{display:inline-block;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);vertical-align:middle}svg{display:block;width:100%;height:100%}</style><svg viewBox="0 0 24 24">${g}</svg>`;
  }
}
customElements.define("ha-icon", HaIcon);

// --- Fixed "now" so the screenshots are reproducible --------------------------
const NOW = Date.parse("2026-10-23T11:51:00Z"); // 13:51 in Europe/Madrid
Date.now = () => NOW;
const iso = (minutes, from = "2026-10-23T11:50:00Z") => new Date(Date.parse(from) + minutes * 60000).toISOString();

const params = new URLSearchParams(location.search);
const theme = params.get("theme") === "dark" ? "dark" : "light";
const language = params.get("lang") || "es";
document.documentElement.dataset.theme = theme;
document.getElementById("title").textContent = `MeteoVeo card — ${theme} · ${language}`;

import("../../custom_components/meteoveo/frontend/meteoveo-card.js").then(() => build());

// --- Sample forecasts ---------------------------------------------------------
const CONDS = ["partlycloudy", "partlycloudy", "cloudy", "rainy", "rainy", "cloudy", "partlycloudy", "sunny", "sunny", "sunny", "clear-night", "clear-night"];
function hourly(night) {
  const out = [];
  for (let i = 0; i < 24; i++) {
    const at = new Date(Date.parse("2026-10-23T12:00:00Z") + i * 3600000);
    const h = (at.getUTCHours() + 2) % 24;
    const day = h >= 8 && h < 19;
    let condition = CONDS[i % CONDS.length];
    if (!day && (condition === "sunny" || condition === "partlycloudy")) condition = condition === "sunny" ? "clear-night" : "partlycloudy";
    if (night && day) condition = "sunny";
    out.push({ datetime: at.toISOString(), condition, temperature: 23 - i * 0.6 + (i > 12 ? i - 12 : 0), apparent_temperature: 23,
      precipitation: condition === "rainy" ? 1.2 : 0, precipitation_probability: condition === "rainy" ? 70 : i === 2 ? 25 : 0,
      wind_speed: 12, wind_bearing: 110, humidity: 50, uv_index: day ? 3 : 0, is_daytime: day });
  }
  return out;
}
const DAILY = [
  ["2026-10-23", "partlycloudy", 24, 13, 0], ["2026-10-24", "rainy", 20, 14, 80], ["2026-10-25", "lightning-rainy", 19, 13, 90],
  ["2026-10-26", "cloudy", 21, 12, 20], ["2026-10-27", "sunny", 25, 11, 0], ["2026-10-28", "sunny", 26, 12, 0], ["2026-10-29", "partlycloudy", 24, 13, 10],
].map(([d, condition, temperature, templow, p]) => ({ datetime: `${d}T12:00:00+01:00`, condition, temperature, templow, precipitation: p ? 4 : 0, precipitation_probability: p, wind_speed: 15, wind_bearing: 270, uv_index: 4 }));

// --- The scenarios --------------------------------------------------------------
function steps(spec, issued = "2026-10-23T11:50:00Z") {
  // spec: array of [band, source, uncertain] per 10-minute lead, 0..180
  return spec.map(([band, source, uncertain], i) => ({ at: iso(i * 10, issued), lead_minutes: i * 10, band, source: source || "radar", uncertain: !!uncertain }));
}
const fillTo = (arr, band = "none", source = "model") => { while (arr.length < 19) arr.push([band, source, false]); return arr; };
const none = (n, source = "radar") => Array.from({ length: n }, () => ["none", source, false]);

const CASES = [
  { title: "Día seco", name: "Castellonet de la Conquesta", condition: "partlycloudy", temp: 23.1, hum: 44, wind: 9, bearing: 113,
    rain: { state: "off", rain_now: false, age_minutes: 2, issued_at: "2026-10-23T11:48:00Z", steps: steps(fillTo(none(7), "none"), "2026-10-23T11:48:00Z") } },
  { title: "Lluvia en 20 min", name: "Gandia", condition: "cloudy", temp: 19.4, hum: 78, wind: 21, bearing: 70,
    rain: { state: "on", rain_now: false, age_minutes: 1, starts_at: iso(20), steps: steps(fillTo([...none(2), ["weak"], ["moderate"], ["moderate"], ["weak"], ["weak"], ...none(3)], "none")) } },
  { title: "Llueve hasta las 14:30, cola incierta", name: "Almiserà", condition: "rainy", temp: 16.2, hum: 93, wind: 7, bearing: 300,
    rain: { state: "on", rain_now: true, age_minutes: 1, ends_at: iso(40), steps: steps(fillTo([["moderate"], ["moderate"], ["weak", "radar", true], ["weak", "radar", true], ...none(4), ["weak", "model", true], ["weak", "model", true]], "none")) } },
  { title: "Aviso naranja", name: "Oliva", condition: "lightning-rainy", temp: 21.0, hum: 88, wind: 34, bearing: 95,
    rain: { state: "on", rain_now: true, age_minutes: 3, steps: steps(fillTo([["heavy"], ["heavy"], ["heavy"], ["moderate"], ["moderate"], ["moderate"], ["weak"], ["weak"]], "weak", "model")) },
    warnings: [
      { level: "orange", phenomenon: "PR", phenomenon_name: "Lluvias", headline: "Precipitación acumulada en una hora: 40 mm. Precipitación acumulada en 12 horas: 100 mm.", onset: "2026-10-23T10:00:00Z", expires: "2026-10-23T22:00:00Z" },
      { level: "yellow", phenomenon: "TO", phenomenon_name: "Tormentas", headline: "Tormentas con granizo.", onset: "2026-10-23T10:00:00Z", expires: "2026-10-23T22:00:00Z" },
    ] },
  { title: "Noche", name: "Xàtiva", condition: "clear-night", temp: 12.3, hum: 71, wind: 4, bearing: 350, night: true,
    rain: { state: "off", rain_now: false, age_minutes: 5, steps: steps(fillTo(none(19)), "2026-10-23T11:46:00Z") } },
  { title: "Radar de hace 75 min (envejecido)", name: "Alcoi", condition: "cloudy", temp: 15.0, hum: 60, wind: 11, bearing: 200,
    rain: { state: "off", rain_now: false, age_minutes: 75, steps: steps(fillTo([...none(10), ["weak"], ["weak"]], "none"), "2026-10-23T10:36:00Z") } },
  { title: "Nowcast no disponible (fuera de cobertura)", name: "Las Palmas de Gran Canaria", condition: "sunny", temp: 26.4, hum: 55, wind: 18, bearing: 20,
    rain: { state: "unavailable" } },
  { title: "Entidad no disponible", name: "Benidorm", condition: "unavailable", temp: null },
];

function hassFor(c, i) {
  const slug = `mv${i}`;
  const states = {
    "sun.sun": { entity_id: "sun.sun", state: c.night ? "below_horizon" : "above_horizon", attributes: {} },
    [`weather.${slug}`]: { entity_id: `weather.${slug}`, state: c.condition, attributes: {
      friendly_name: c.name, temperature: c.temp, humidity: c.hum, pressure: 1014, wind_speed: c.wind, wind_bearing: c.bearing,
      temperature_unit: "°C", wind_speed_unit: "km/h", precipitation_unit: "mm", pressure_unit: "hPa",
      attribution: "Datos: © AEMET, MeteoVeo. Avisos: © AEMET (Plan Meteoalerta)." } },
    [`binary_sensor.${slug}_rain_soon`]: c.rain ? { entity_id: `binary_sensor.${slug}_rain_soon`, state: c.rain.state, attributes: { ...c.rain, state: undefined } } : undefined,
    [`sensor.${slug}_warnings`]: { entity_id: `sensor.${slug}_warnings`, state: String((c.warnings || []).length),
      attributes: { highest_level: c.warnings ? c.warnings[0].level : "none", warnings: c.warnings || [] } },
  };
  const entities = {};
  for (const [id, key] of [[`weather.${slug}`, "forecast"], [`binary_sensor.${slug}_rain_soon`, "rain_soon"], [`sensor.${slug}_warnings`, "warnings"]]) {
    entities[id] = { entity_id: id, platform: "meteoveo", device_id: `dev-${slug}`, translation_key: key };
  }
  return {
    states, entities,
    locale: { language, time_format: "24" },
    config: { time_zone: "Europe/Madrid" },
    themes: { darkMode: theme === "dark" },
    connection: {
      subscribeMessage(cb, msg) {
        if (c.condition === "unavailable") return Promise.resolve(() => {});
        setTimeout(() => cb({ type: msg.forecast_type, forecast: msg.forecast_type === "hourly" ? hourly(c.night) : DAILY }), 30);
        return Promise.resolve(() => {});
      },
    },
  };
}

function build() {
  const grid = document.getElementById("grid");
  CASES.forEach((c, i) => {
    const wrap = document.createElement("div");
    wrap.className = "case";
    const label = document.createElement("span");
    label.textContent = c.title;
    const card = document.createElement("meteoveo-card");
    card.setConfig({ entity: `weather.mv${i}` });
    wrap.append(label, card);
    grid.append(wrap);
    card.hass = hassFor(c, i);
  });
  // The stub-config path and the editor schema, for a quick sanity check in the console.
  const Card = customElements.get("meteoveo-card");
  console.log("stub", Card.getStubConfig(hassFor(CASES[0], 0)), "schema fields", Card.getConfigForm().schema.length);
}
</script>
</body>
</html>
